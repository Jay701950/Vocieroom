<style>

::selection{background:rgba(139,107,255,.4)}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}

    if(p.connectionState=='failed'&&p.init)call(id,true)};  // 연결 끊기면 ICE 재시작
  local.getTracks().forEach(t=>p.addTrack(t,local));
  p.onicecandidate=e=>e.candidate&&send(id,{ice:e.candidate});
  p.ontrack=e=>{if($('#a'+id))return;
    const a=document.createElement('audio');a.id='a'+id;a.srcObject=e.streams[0];a.autoplay=true;a.volume=ST.vol/100;
    $('#audios').append(a);a.play().catch(()=>{});watch(id,e.streams[0])};
  return p}
async function call(id,restart){const p=pc(id);p.init=true;await p.setLocalDescription(await p.createOffer({iceRestart:!!restart}));send(id,{sdp:p.localDescription})}
async function sig(from,d){
  if(d.k=='s'){  // 상대가 보내는 화면 공유 (받는 쪽)
    if(d.stop){rmStage(from);pcs[from+':s']?.close();delete pcs[from+':s'];return}
    if(d.sdp?.type=='offer'&&pcs[from+':s']){pcs[from+':s'].close();delete pcs[from+':s']}
    const p=pcS(from);
    if(d.sdp){await p.setRemoteDescription(d.sdp);const an=await p.createAnswer();an.sdp=hq(an.sdp);await p.setLocalDescription(an);send(from,{sdp:p.localDescription,k:'v'})}
    else if(d.ice)await p.addIceCandidate(d.ice).catch(()=>{});
    return}
  if(d.k=='v'){  // 시청자가 보내는 응답 (공유하는 쪽)
    const p=pcs['to:'+from];if(!p)return;
    if(d.sdp)await p.setRemoteDescription(d.sdp);else if(d.ice)await p.addIceCandidate(d.ice).catch(()=>{});
    return}
  const p=pc(from);
  if(d.sdp){await p.setRemoteDescription(d.sdp);
    if(d.sdp.type=='offer'){await p.setLocalDescription(await p.createAnswer());send(from,{sdp:p.localDescription})}}
  else if(d.ice)await p.addIceCandidate(d.ice).catch(()=>{})}
</script>
<script type="module">

const app=initializeApp({apiKey:"AIzaSyBNJjiLMgiBw8O8ewz8A-r0EWXFTHaf1zw",authDomain:"voiceroom-3f840.firebaseapp.com",projectId:"voiceroom-3f840",appId:"1:879518912682:web:a6c9df148e03c5d83c80d3"});
const auth=getAuth(app),db=getFirestore(app);
const ready=setPersistence(auth,browserLocalPersistence).catch(()=>{});
// 아이디(대소문자 무시) → 해시. usernames/{해시} 문서가 "이 아이디는 사용 중" 표시이자 로그인용 이메일 연결표
const hx=async n=>{const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(n.normalize('NFC').toLowerCase()));
  return [...new Uint8Array(h)].slice(0,16).map(b=>b.toString(16).padStart(2,'0')).join('')};
const valid=n=>{const l=[...n].length;if(l<2||l>12)throw {message:'아이디는 2~12자로 입력해 주세요'}};
const reauth=async p=>{const u=auth.currentUser;await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,p))};
window.fb={
  async signup(n,p){await ready;valid(n);const ref=doc(db,'usernames',await hx(n));
    if((await getDoc(ref)).exists())throw {code:'auth/email-already-in-use'};
    const mail=crypto.randomUUID().replace(/-/g,'')+'@voiceroom.app';
    const c=await createUserWithEmailAndPassword(auth,mail,p);
    try{await setDoc(ref,{uid:c.user.uid,mail,name:n})}catch(e){await c.user.delete().catch(()=>{});throw {code:'auth/email-already-in-use'}}
    await updateProfile(c.user,{displayName:n});setMe({name:n,avatar:null})},
  async login(n,p){await ready;const h=await hx(n),ref=doc(db,'usernames',h),d=await getDoc(ref);
    const c=await signInWithEmailAndPassword(auth,d.exists()?d.data().mail:h+'@voiceroom.app',p);
    if(await hx(c.user.displayName||'')!==h){await signOut(auth);throw {code:'auth/invalid-credential'}}
    if(!d.exists())await setDoc(ref,{uid:c.user.uid,mail:c.user.email,name:n}).catch(()=>{})},
  async rename(n,p){valid(n);const u=auth.currentUser;await reauth(p);
    const nh=await hx(n),oh=await hx(u.displayName||'');
    if(nh!=oh){const or=doc(db,'usernames',oh),b=writeBatch(db);b.set(doc(db,'usernames',nh),{uid:u.uid,mail:u.email,name:n});
      if((await getDoc(or)).exists())b.delete(or);
      try{await b.commit()}catch(e){throw {code:'auth/email-already-in-use'}}}
    await updateProfile(u,{displayName:n})},
  async password(o,nw){await reauth(o);await updatePassword(auth.currentUser,nw)},
  logout:()=>signOut(auth),

};
onAuthStateChanged(auth,async u=>{
