<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c14">
<title>보이스룸</title>
<style>
:root{color-scheme:dark;--bg:#0b0c14;--line:rgba(255,255,255,.1);--glass:rgba(255,255,255,.06);--pri:#7c5cff;--pri2:#4f8cff;--ok:#2ee59d;--red:#ff4d6d;--txt:#f2f3ff;--mut:#9a9cc0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--txt)}
body{font:15px/1.45 Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;min-height:100dvh}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg::before,.bg::after{content:'';position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);animation:drift 22s ease-in-out infinite alternate}
.bg::before{background:#5b3cff;opacity:.5;top:-30vmax;left:-20vmax}
.bg::after{background:#00b4d8;opacity:.3;bottom:-35vmax;right:-25vmax;animation-delay:-11s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.1)}}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
@keyframes fade{from{opacity:0}}
@keyframes rip{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#app{max-width:560px;margin:auto;padding:max(14px,env(safe-area-inset-top)) 16px 130px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 18px}
.logo{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:800;letter-spacing:-.02em}
.logo b{background:linear-gradient(90deg,#d3c8ff,#7fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:26px;margin:6px 0 2px;letter-spacing:-.03em}
.sub{color:var(--mut);margin:0 0 18px;min-height:1.4em}
button{font:inherit;color:inherit;border:0;cursor:pointer;transition:transform .15s,opacity .2s}
button:active{transform:scale(.96)}button:disabled{opacity:.5}
.primary{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:700;border-radius:14px;padding:13px 18px;box-shadow:0 10px 26px -10px rgba(124,92,255,.9)}
.ghost{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.ghost.sm{padding:9px 14px;border-radius:99px;font-size:14px}
.wide{width:100%;margin-top:12px}
input[type=text],input[type=password],input:not([type]){width:100%;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--txt);font:inherit;outline:0;margin-top:8px}
input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(124,92,255,.25)}
.chip{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:5px 6px 5px 5px;backdrop-filter:blur(14px);max-width:62vw}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.chip .lo{background:rgba(255,255,255,.1);border-radius:99px;padding:6px 10px;font-size:12px;color:var(--mut)}
.av{width:100%;height:100%;border-radius:50%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;color:#fff;transition:box-shadow .15s}
.av.sm{width:32px;height:32px;font-size:15px;flex:none;cursor:pointer}
/* 방 목록 */
.rcard{display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:12px;background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(18px);animation:up .35s both}
.rcard.full{opacity:.55}
.ric{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-weight:800;font-size:21px;color:#fff;flex:none}
.mid{flex:1;min-width:0}
.rn{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pips,.seats{display:flex;gap:4px;margin-top:7px}
.pips i,.seats i{width:16px;height:6px;border-radius:99px;background:rgba(255,255,255,.14)}
.seats i{flex:1;height:8px}
.pips i.on,.seats i.on{background:linear-gradient(90deg,var(--pri),var(--pri2))}
.join{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:700;border-radius:99px;padding:10px 18px}
.join:disabled{background:rgba(255,255,255,.12)}
.empty{text-align:center;color:var(--mut);padding:56px 10px;animation:up .4s both}
.empty div{font-size:46px;margin-bottom:8px}
/* 방 만들기 버튼 */
#fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));width:66px;height:66px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));display:grid;place-items:center;box-shadow:0 16px 36px -8px rgba(124,92,255,.95),0 0 0 7px rgba(124,92,255,.16);z-index:10}
#fab:active{transform:scale(.9) rotate(90deg)}
/* 시트(팝업) */
.sheet{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,6,12,.55);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.sheet.open{opacity:1;pointer-events:auto}
.panel{width:100%;max-width:480px;background:rgba(24,25,42,.95);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(50px);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.sheet.open .panel{transform:none}
@media(min-width:600px){.sheet{align-items:center}.panel{border-radius:28px}}
.panel h3{margin:0 0 4px;font-size:21px;letter-spacing:-.02em}
.panel label{display:flex;justify-content:space-between;margin-top:18px;color:var(--mut);font-size:14px}
.panel label b{color:var(--txt);font-size:17px}
.hint{display:block;color:var(--mut);margin-top:10px;font-size:13px}
.tabs{display:flex;background:rgba(255,255,255,.07);border-radius:14px;padding:4px;margin:14px 0 6px}
.tabs button{flex:1;background:none;padding:10px;border-radius:11px;color:var(--mut);font-weight:600}
.tabs button.on{background:rgba(255,255,255,.13);color:#fff}
/* 드래그 슬라이더 */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:99px;margin:16px 0 4px;padding:0;border:0;outline:0;background:linear-gradient(90deg,var(--pri) var(--p,33%),rgba(255,255,255,.14) var(--p,33%));touch-action:pan-y}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;border:0;box-shadow:0 4px 16px rgba(124,92,255,.8)}
input[type=range]::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:#fff;border:0}
/* 방 안 */
.rhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.rhead h2{margin:0;font-size:22px;letter-spacing:-.02em}
.back{width:42px;height:42px;border-radius:50%;background:var(--glass);border:1px solid var(--line);font-size:18px;flex:none}
.pill{display:inline-block;margin-top:2px;background:rgba(46,229,157,.14);color:var(--ok);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:30px 12px;margin:34px 0;text-align:center}
.tile{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.av-wrap{position:relative;width:98px;height:98px;margin:auto}
.av-wrap::before,.av-wrap::after{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid var(--ok);opacity:0}
.speak .av-wrap::before{animation:rip 1.2s ease-out infinite}
.speak .av-wrap::after{animation:rip 1.2s ease-out .6s infinite}
.speak .av{box-shadow:0 0 0 4px var(--ok),0 0 28px 6px rgba(46,229,157,.55)}
.nm{margin-top:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .nm::after{content:' · 나';color:var(--mut);font-weight:500}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;padding:10px;background:rgba(30,32,52,.7);border:1px solid var(--line);border-radius:99px;backdrop-filter:blur(20px);z-index:10}
.round{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.12);font-size:23px}
.round.off{background:var(--red)}
.leave{background:var(--red);color:#fff;font-weight:700;border-radius:99px;height:56px;padding:0 26px}
.toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(34,36,60,.96);border:1px solid var(--line);padding:11px 18px;border-radius:99px;z-index:50;white-space:nowrap;animation:fade .25s}
</style></head><body>
<div class="bg"></div>
<div id="app">
  <header><div class="logo">🎙<b>보이스룸</b></div><div id="acct"></div></header>

  <main id="lobby">
    <h1>지금 열려 있는 방</h1>
    <p class="sub" id="cnt"></p>
    <div id="rooms"></div>
  </main>

  <main id="room" hidden>
    <div class="rhead"><button class="back" onclick="leave()" aria-label="뒤로">←</button><div><h2 id="rt"></h2><span class="pill" id="rc"></span></div></div>
    <div id="grid"></div>
    <div class="dock"><button class="round" id="mute" aria-label="마이크">🎤</button><button class="leave" onclick="leave()">나가기</button></div>
  </main>
</div>

<button id="fab" aria-label="방 만들기" onclick="openSheet('mCreate')"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="sheet" id="mCreate"><div class="panel">
  <h3>새 방 만들기</h3><span class="hint" style="margin:0">누구나 입장할 수 있는 방이 로비에 열려요</span>
  <label>방 이름</label><input id="rn" maxlength="20" placeholder="예) 밤샘 게임방">
  <label>최대 인원 <b id="rv">4명</b></label>
  <input type="range" id="rm" min="2" max="8" value="4" step="1">
  <div class="seats" id="seats"></div>
  <button class="primary wide" onclick="addRoom()">방 만들기</button>
</div></div>

<div class="sheet" id="mAuth"><div class="panel">
  <h3>보이스룸 계정</h3>
  <div class="tabs"><button id="tL" class="on" onclick="tab('login')">로그인</button><button id="tS" onclick="tab('signup')">회원가입</button></div>
  <input id="u" maxlength="12" placeholder="이름 (2~12자)" autocomplete="username">
  <input id="p" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password">
  <span class="hint" id="ah">가입한 이름과 비밀번호를 입력하세요</span>
  <button class="primary wide" id="asub" onclick="auth()">로그인</button>
  <span class="hint">가입하면 프사가 계정에 저장돼요 (프로필 사진은 로그인 후 상단 동그라미를 눌러 바꿔요)</span>
</div></div>

<div class="sheet" id="mNick"><div class="panel">
  <h3>어떤 이름으로 들어갈까요?</h3><span class="hint" style="margin:0">로그인 없이 닉네임만 정하면 바로 입장할 수 있어요</span>
  <input id="nk" maxlength="12" placeholder="닉네임">
  <button class="primary wide" onclick="nickGo()">입장하기</button>
  <button class="ghost wide" onclick="closeSheet('mNick');openSheet('mAuth')">로그인 · 회원가입</button>
</div></div>

<div id="audios"></div>
<input type="file" id="f" accept="image/*" hidden>

<script>
const $=s=>document.querySelector(s),api=(p,o={})=>fetch('/api/'+p,o);
const btn=(t,f)=>{const b=document.createElement('button');b.textContent=t;b.onclick=f;return b};
const hue=s=>[...s].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360;
// TURN 서버가 있으면 아래 주석 풀고 주소/아이디/비번 넣기 (연결 안 되거나 끊기는 문제의 제일 큰 해결책)
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}
  /* ,{urls:'turn:서버주소:443?transport=tcp',username:'아이디',credential:'비번'} */],
  iceCandidatePoolSize:4,bundlePolicy:'max-bundle'};
let me=null,ws,local,ctx,ping,wl,pend,curMax=0,lastRooms='',mode='login',pcs={},timers={},q=Promise.resolve();

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}
const openSheet=id=>$('#'+id).classList.add('open'),closeSheet=id=>$('#'+id).classList.remove('open');
document.querySelectorAll('.sheet').forEach(s=>s.onclick=e=>{if(e.target==s)s.classList.remove('open')});

// 프사: 등록 안 했으면 이름 첫 글자 + 이름에서 뽑은 색
function avatarEl(name,av){
  const d=document.createElement('div');d.className='av';
  if(av)d.style.backgroundImage=`url("${av}")`;
  else{const h=hue(name);d.style.background=`linear-gradient(135deg,hsl(${h} 70% 58%),hsl(${(h+50)%360} 70% 42%))`;d.textContent=[...name][0]||'?'}
  return d}

// 계정 (Firebase 로그인은 맨 아래 module 스크립트가 처리)
function setMe(m){me=m;drawAcct()}
function drawAcct(){
  const a=$('#acct');a.replaceChildren();
  if(me){const c=document.createElement('div');c.className='chip';
    const i=avatarEl(me.name,me.avatar);i.classList.add('sm');i.title='프사 바꾸기';i.onclick=()=>$('#f').click();
    const n=document.createElement('span');n.textContent=me.name;
    const o=btn('로그아웃',()=>fb.logout());o.className='lo';c.append(i,n,o);a.append(c)}
  else{const b=btn('로그인 · 가입',()=>openSheet('mAuth'));b.className='ghost sm';a.append(b)}}
function tab(m){mode=m;$('#tL').classList.toggle('on',m=='login');$('#tS').classList.toggle('on',m=='signup');
  $('#asub').textContent=m=='login'?'로그인':'가입하기';
  $('#ah').textContent=m=='login'?'가입한 이름과 비밀번호를 입력하세요':'이름 2~12자 · 비밀번호 6자 이상'}
const ERR={'auth/weak-password':'비밀번호는 6자 이상이에요','auth/email-already-in-use':'이미 있는 이름이에요','auth/invalid-credential':'이름/비밀번호를 확인해 주세요'};
async function auth(){
  const b=$('#asub');b.disabled=true;
  try{await fb[mode]($('#u').value.trim(),$('#p').value);closeSheet('mAuth');$('#p').value='';toast(mode=='login'?'로그인했어요':'가입 완료!')}
  catch(e){toast(ERR[e.code]||e.message||'실패했어요')}
  b.disabled=false}
$('#p').onkeydown=e=>e.key=='Enter'&&auth();
$('#f').onchange=e=>{
  const f=e.target.files[0];if(!f||!me)return;const im=new Image();
  im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const s=Math.min(im.width,im.height);
    c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);
    const av=c.toDataURL('image/jpeg',.8);fb.saveAvatar(av).then(()=>{setMe({...me,avatar:av});toast('프사를 바꿨어요')})};
  im.src=URL.createObjectURL(f);e.target.value=''};
drawAcct();

// 방 만들기 (인원은 드래그 슬라이더)
const rm=$('#rm');
function syncCap(){const v=+rm.value;$('#rv').textContent=v+'명';rm.style.setProperty('--p',(v-2)/6*100+'%');
  $('#seats').replaceChildren(...[...Array(8)].map((_,i)=>{const s=document.createElement('i');if(i<v)s.className='on';return s}))}
rm.oninput=syncCap;syncCap();
async function addRoom(){
  const name=$('#rn').value.trim();if(!name)return toast('방 이름을 입력해 주세요');
  const r=await api('rooms',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,max:+rm.value})});
  if(!r.ok)return toast('방을 만들 수 없어요 (방이 너무 많아요)');
  $('#rn').value='';closeSheet('mCreate');toast('방이 만들어졌어요');lastRooms='';loadRooms()}

// 로비
function roomCard(r){
  const d=document.createElement('div');d.className='rcard'+(r.n>=r.max?' full':'');
  const ic=document.createElement('div');ic.className='ric';const h=hue(r.name);
  ic.style.background=`linear-gradient(135deg,hsl(${h} 80% 60%),hsl(${(h+50)%360} 80% 45%))`;ic.textContent=[...r.name][0];
  const mid=document.createElement('div');mid.className='mid';
  const t=document.createElement('div');t.className='rn';t.textContent=r.name;
  const p=document.createElement('div');p.className='pips';
  for(let i=0;i<r.max;i++){const s=document.createElement('i');if(i<r.n)s.className='on';p.append(s)}
  mid.append(t,p);
  const b=btn(r.n>=r.max?'가득 참':'입장',()=>enter(r.id,r.name,r.max));b.className='join';b.disabled=r.n>=r.max;
  d.append(ic,mid,b);return d}
function emptyEl(){const d=document.createElement('div');d.className='empty';
  d.innerHTML='<div>🫧</div>아직 열린 방이 없어요<br>오른쪽 아래 + 버튼으로 첫 방을 만들어 보세요';return d}
async function loadRooms(){
  if($('#lobby').hidden||document.hidden)return;
  const js=await(await api('rooms')).text();if(js==lastRooms)return;lastRooms=js;
  const rs=JSON.parse(js).sort((a,b)=>b.n-a.n);
  $('#cnt').textContent=rs.length?`${rs.length}개의 방 · ${rs.reduce((s,r)=>s+r.n,0)}명 접속 중`:'';
  $('#rooms').replaceChildren(...(rs.length?rs.map(roomCard):[emptyEl()]))}
setInterval(()=>loadRooms().catch(()=>{}),3000);loadRooms();

// 입장: 로그인 안 했으면 닉네임부터 물어봄
function enter(id,title,max){
  if(me)return join(id,title,max);
  pend=[id,title,max];$('#nk').value=localStorage.nick||'';openSheet('mNick');setTimeout(()=>$('#nk').focus(),300)}
function nickGo(){
  const n=$('#nk').value.trim();if(!n)return toast('닉네임을 입력해 주세요');
  localStorage.nick=n;closeSheet('mNick');join(...pend)}
$('#nk').onkeydown=e=>e.key=='Enter'&&nickGo();

// 방
const send=(to,data)=>ws?.readyState==1&&ws.send(JSON.stringify({to,data}));
const rc=()=>$('#rc').textContent=`${$('#grid').children.length}/${curMax}명`;
async function join(id,title,max){
  ctx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});ctx.resume();
  try{local=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1,sampleRate:48000,latency:0}})}
  catch{ctx.close();return toast('마이크 권한이 필요해요')}
  curMax=max;$('#lobby').hidden=true;$('#fab').hidden=true;$('#room').hidden=false;$('#rt').textContent=title;wake();
  const proto=location.protocol=='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}/ws?room=${id}`);
  ws.onopen=()=>ws.send(JSON.stringify({name:me?.name||localStorage.nick||'',avatar:me?.avatar||null}));
  ws.onmessage=e=>{q=q.then(()=>onMsg(JSON.parse(e.data))).catch(console.error)};
  ws.onclose=()=>leave();
  ping=setInterval(()=>ws.readyState==1&&ws.send('{}'),25000)}

function leave(){
  if(!local)return;
  const w=ws;ws=null;w?.close();clearInterval(ping);
  Object.values(timers).forEach(clearInterval);timers={};
  Object.values(pcs).forEach(p=>p.close());pcs={};
  local.getTracks().forEach(t=>t.stop());local=null;ctx?.close();wl?.release().catch(()=>{});wl=null;
  $('#grid').replaceChildren();$('#audios').replaceChildren();$('#mute').textContent='🎤';$('#mute').classList.remove('off');
  $('#room').hidden=true;$('#lobby').hidden=false;$('#fab').hidden=false;lastRooms='';loadRooms()}

async function onMsg(m){
  if(m.t=='err'){toast(m.m);return leave()}
  if(!local)return;
  if(m.t=='welcome'){tile(m.id,m.name,m.avatar,local);for(const p of m.peers){tile(p.id,p.name,p.avatar);await call(p.id)}}
  if(m.t=='join')tile(m.id,m.name,m.avatar);
  if(m.t=='leave'){pcs[m.id]?.close();delete pcs[m.id];clearInterval(timers[m.id]);$('#t'+m.id)?.remove();$('#a'+m.id)?.remove();rc()}
  if(m.t=='sig')await sig(m.from,m.data)}

function tile(id,name,av,stream){
  if($('#t'+id))return;
  const t=document.createElement('div');t.id='t'+id;t.className='tile';
  const w=document.createElement('div');w.className='av-wrap';w.append(avatarEl(name,av));
  const n=document.createElement('div');n.className='nm';n.textContent=name;
  t.append(w,n);$('#grid').append(t);rc();
  if(stream){t.classList.add('me');watch(id,stream)}}

// 말하는 중이면 타일에 speak 클래스 → 초록 원
function watch(id,stream){
  const an=ctx.createAnalyser();an.fftSize=512;ctx.createMediaStreamSource(stream).connect(an);
  const b=new Uint8Array(an.fftSize);
  timers[id]=setInterval(()=>{an.getByteTimeDomainData(b);let s=0;for(const v of b)s+=((v-128)/128)**2;
    $('#t'+id)?.classList.toggle('speak',Math.sqrt(s/b.length)>.03)},100)}

$('#mute').onclick=e=>{const t=local.getAudioTracks()[0];t.enabled=!t.enabled;
  e.target.textContent=t.enabled?'🎤':'🔇';e.target.classList.toggle('off',!t.enabled)};

// 음질/안정성: 높은 비트레이트 + 우선순위, 화면 꺼짐 방지
async function tune(p){
  const br=Object.keys(pcs).length>4?64000:96000;
  for(const s of p.getSenders()){
    if(s.track?.kind!='audio')continue;
    const r=s.getParameters();if(!r.encodings?.length)r.encodings=[{}];
    Object.assign(r.encodings[0],{maxBitrate:br,priority:'high',networkPriority:'high'});
    await s.setParameters(r).catch(()=>{})}}
async function wake(){try{wl=await navigator.wakeLock?.request('screen')}catch{}}
document.addEventListener('visibilitychange',()=>{if(document.hidden||!local)return;ctx?.resume();wake()});

// WebRTC (방 안 사람끼리 1:1로 연결)
function pc(id){
  if(pcs[id])return pcs[id];
  const p=pcs[id]=new RTCPeerConnection(ICE);
  p.onconnectionstatechange=()=>{
    if(p.connectionState=='connected')tune(p);
    if(p.connectionState=='failed'&&p.init)call(id,true)};  // 연결 끊기면 ICE 재시작
  local.getTracks().forEach(t=>p.addTrack(t,local));
  p.onicecandidate=e=>e.candidate&&send(id,{ice:e.candidate});
  p.ontrack=e=>{if($('#a'+id))return;
    const a=document.createElement('audio');a.id='a'+id;a.srcObject=e.streams[0];a.autoplay=true;
    $('#audios').append(a);a.play().catch(()=>{});watch(id,e.streams[0])};
  return p}
async function call(id,restart){const p=pc(id);p.init=true;await p.setLocalDescription(await p.createOffer({iceRestart:!!restart}));send(id,{sdp:p.localDescription})}
async function sig(from,d){
  const p=pc(from);
  if(d.sdp){await p.setRemoteDescription(d.sdp);
    if(d.sdp.type=='offer'){await p.setLocalDescription(await p.createAnswer());send(from,{sdp:p.localDescription})}}
  else if(d.ice)await p.addIceCandidate(d.ice).catch(()=>{})}
</script>
